services:
  postgres:
    image: postgres:16-alpine
    container_name: classhelper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: classhelper_user
      POSTGRES_PASSWORD: classhelper_password
      POSTGRES_DB: classhelper_db
      TZ: Asia/Seoul
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
